# Hyperparameters for the custom transformer architecture (dims, layers, heads).
#
# Sourced from: src/models/table_encoder.py, src/models/rcpe.py,
# src/encoding/cell_encoder.py, src/training/training_config.md
#
# `defaults` = current values used in code today. Loaded automatically as
#              argparse defaults by scripts/pretrain_electra.py and
#              scripts/finetune_query_table.py (via
#              src/training/config.py::apply_yaml_defaults) -- editing a
#              value here changes what a flag-less run actually uses.
#              Pass the matching --flag on the command line to override
#              any single value for one run without touching this file.
# `sweep`    = candidate values worth trying, for settings marked [default]
#              (reasonable-but-unvalidated) in training_config.md.
#              Settings marked [deliberate] are left out of `sweep` on
#              purpose -- change them only with a specific reason, not as
#              part of a blind grid search.
#
# Data/batching caps (max_rows, max_columns) live in pretrain.yaml /
# finetune.yaml instead of here -- they're data-pipeline concerns, not
# architecture.
#
# NOTE (current simplification): numeric cells are no longer routed to a
# separate NumericEmbedder -- every cell (numeric-looking or not) is
# encoded as text via BERT. A cell's final embedding is the RAW
# CONCATENATION of its own text embedding and its column's header
# embedding -- concat only, NO projection back down afterward. Headers
# are embedded independently via BERT's own [CLS] token per header (no
# joined-sequence encoding, no cross-header contextualizer transformer
# on top -- that HeaderContextualizer step has been dropped from the
# main path). numeric_embedder.py / cell_type.py routing logic and the
# HeaderContextualizer class are unused for now; revisit later if
# numeric-aware encoding is worth reintroducing.
#
# Because there's no projection after the concat, `embed_dim` below is
# the FINAL per-cell width, and BERT itself projects to `embed_dim // 2`
# for the cell half and the header half separately (so concatenating the
# two lands exactly on `embed_dim`). `embed_dim` must be even.

defaults:
  # -- cell + header encoder (single shared BERT + projection) --
  text_model_name: bert-base-uncased      # [default] never compared against alternatives
  text_trainable: false                   # [deliberate] frozen BERT + trainable projection (CLIP-style)
  text_max_length: 32                     # [deliberate] sized for short cell values; known-inadequate for prose-heavy cells
  text_max_batch_size: 2048               # [deliberate] internal BERT chunk size, safety bound

  # -- table encoder / RCPE table layers --
  embed_dim: 64                           # [default] must be even (BERT projects to embed_dim // 2 per half)
  num_layers: 1                           # [default] cheap to increase, cell encoding (BERT) dominates >99% of wall time
  nonlinearity: sigmoid                   # [deliberate] follows original spec sigma(gate * X X^T); tanh/relu wired but untested
  channel_mix_hidden_dim: null            # [default] defaults to embed_dim * 2 when null; lighter than standard transformer FFN (x4)

sweep:
  embed_dim: [32, 64, 96, 128]
  nonlinearity: [sigmoid, tanh, relu]
  channel_mix_hidden_dim: [null, 128, 256]   # null = embed_dim * 2
  num_layers: [1, 2, 3]
