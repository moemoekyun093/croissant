# Training hyperparameters: learning rate, batch size, epochs, optimizer settings.
#
# Sourced from: src/training/trainer.py, src/training/losses.py,
# src/data/augmentation.py, scripts/pilot_train.py,
# src/training/training_config.md
#
# `defaults` = current values used in code today.
# `sweep`    = candidate values worth trying, for settings flagged 🤷
#              (reasonable-but-unvalidated) in training_config.md.
#              Settings flagged 🎯 (deliberately reasoned) are left out
#              of `sweep` on purpose -- change them only with a specific
#              reason, not as part of a blind grid search.

defaults:
  # -- optimizer (AdamW, src/training/trainer.py::build_optimizer) --
  optimizer: adamw                        # 🤷 standard default, not compared against alternatives
  lr: 1.0e-4                              # 🤷 standard transformer fine-tuning default, never swept here
  weight_decay: 0.01                      # 🤷 standard AdamW default

  # -- LR schedule (linear warmup -> linear decay to 0) --
  warmup_ratio: 0.1                       # 🎯 standard convention, 10% of total steps
  grad_clip_norm: 1.0                     # 🎯 standard safeguard, conventional value

  # -- batching / epochs --
  batch_size: 64                          # 🎯 chosen from free GPU memory headroom (cuda:2, ~95GB free), not a derived optimum
  num_epochs: 15                          # 🤷 no principled stopping criterion yet -- watch train vs. val loss

  # -- contrastive loss (src/training/losses.py::info_nce_loss) --
  temperature: 0.07                       # 🎯 taken directly from Starmie, not re-derived for this architecture
  loss_direction: symmetric               # 🎯 query->doc and doc->query averaged (CLIP/Starmie convention)
  negatives: in_batch                     # 🎯 every other table + its augmented view; no hard-negative mining yet

  # -- augmentation (src/data/augmentation.py::augment_table) --
  row_keep_frac: 0.7                      # 🤷 "moderate" subset size chosen by feel, not swept
  col_keep_frac: 0.7                      # 🤷 same as above

  # -- data split --
  val_frac: 0.1                           # 🤷 standard default split ratio, not tuned

  # -- infra / logging --
  device: cuda:2                          # 🎯 picked from nvidia-smi free-GPU check at the time; re-check before reuse
  checkpoint_dir: eval/report_runs/pilot
  log_every: 10

sweep:
  lr: [5.0e-5, 1.0e-4, 2.0e-4, 5.0e-4]
  weight_decay: [0.0, 0.01, 0.1]
  batch_size: [32, 64, 128, 256]
  num_epochs: [10, 15, 20, 30]
  temperature: [0.03, 0.05, 0.07, 0.1]
  row_keep_frac: [0.5, 0.6, 0.7, 0.8]
  col_keep_frac: [0.5, 0.6, 0.7, 0.8]
